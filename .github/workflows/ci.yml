name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel an older run on the same branch when a new commit is pushed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Type check and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # same as netlify.toml
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Build (site, pre-rendered pages, sitemap/robots)
        run: npm run build:site

      - name: Check generated SEO files and RSS feed
        run: |
          test -s dist/robots.txt
          grep -q '</urlset>' dist/sitemap.xml
          grep -q '/archive/' dist/sitemap.xml
          grep -q '<item>' dist/rss.xml

      - name: Check pre-rendered pages
        run: |
          test -s dist/404.html
          grep -qE '<title>[^<]+ — SPACEKID LABS</title>' dist/archive/wavesets.html  # the post's own title, not the default
          grep -q 'property="og:type" content="article"' dist/archive/wavesets.html
          test "$(ls dist/archive/*.html | wc -l)" -ge 20
