<!doctype html>
<!--
  Not a page anyone visits. Netlify reads this file at deploy time to register the "contact" form, and the
  form in src/components/ContactForm.tsx posts here. Keep the field names in step with that component.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex" />
    <title>Contact form</title>
  </head>
  <body>
    <form name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input name="bot-field" />
      <input name="name" />
      <input type="email" name="email" />
      <select name="service">
        <option value="production">Production</option>
        <option value="mixing">Mixing</option>
        <option value="mastering">Mastering</option>
        <option value="sound-design">Sound design / samples</option>
        <option value="software">Audio software</option>
        <option value="other">Something else</option>
      </select>
      <textarea name="message"></textarea>
      <input name="links" />
      <input name="page" />
    </form>
  </body>
</html>
