[build]
  command = "npm run build:site"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Built JS/CSS files get a new name whenever they change, so browsers can keep them for a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Pages are pre-rendered to dist/<path>.html (scripts/prerender.ts) and served directly.
# Any other URL gets the empty app shell, which shows the 404 page.
# /api/proxy-audio is handled by netlify/functions/proxy-audio.mts first.
[[redirects]]
  from = "/*"
  to = "/shell.html"
  status = 200
