[build]
  command = "npx vite build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Send every page route to the React app (client-side routing).
# /api/proxy-audio is handled by netlify/functions/proxy-audio.mts first.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
