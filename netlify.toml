[build]
  command = "npm run build:site"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Built JS/CSS files get a new name whenever they change, so browsers can keep them for a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Sample previews (scripts/make-sample-previews.ts). Names don't change when a file is re-encoded,
# so cache for a week rather than forever.
[[headers]]
  for = "/audio/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/favicons/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/rss.xml"
  [headers.values]
    Content-Type = "application/rss+xml; charset=utf-8"

# Pages are pre-rendered to dist/<path>.html (scripts/prerender.ts) and served directly.
# Any other URL gets the empty app shell, which shows the 404 page, with a real 404 status
# so search engines don't index mistyped URLs as pages.
[[redirects]]
  from = "/*"
  to = "/shell.html"
  status = 404
